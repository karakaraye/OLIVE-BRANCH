services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: olive_branch
      POSTGRES_USER: olive_branch
      POSTGRES_PASSWORD: olive_branch_dev
    ports:
      - "127.0.0.1:${OLIVE_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olive_branch -d olive_branch"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
